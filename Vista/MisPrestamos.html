<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/CSS/Registro.css">

    <title>CLUB ACERIAS - Mis Préstamos</title>
</head>

<body class="fondo">

    <div class="header-mr d-flex justify-content-between align-items-center">

        <h3>Mis Préstamos</h3>

        <a href="dashboard.html" class="btn btn-light btn-sm">
            <i class="bi bi-arrow-left"></i>
            Volver al panel
        </a>

    </div>

    <div class="container py-4">

        <div id="mensaje" class="mb-3"></div>

        <div class="card form-card shadow-sm p-4">

            <h5 class="seccion">
                <i class="bi bi-currency-dollar"></i>
                Historial de préstamos
            </h5>

            <p class="text-muted">
                Consulta los préstamos registrados a tu nombre.
            </p>

            <div class="table-responsive">

                <table class="table table-striped table-hover">

                    <thead class="table-primary">

                        <tr>
                            <th>Código</th>
                            <th>Fecha del préstamo</th>
                            <th>Valor</th>
                            <th>Tasa de interés</th>
                            <th>Número de cuotas</th>
                        </tr>

                    </thead>

                    <tbody id="tablaPrestamos">

                        <tr>
                            <td colspan="5" class="text-center">
                                Cargando préstamos...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

            <div class="mt-3">

                <a href="dashboard.html" class="btn btn-outline-primary">
                    <i class="bi bi-arrow-left"></i>
                    Volver
                </a>

            </div>

        </div>

    </div>

    <script src="../Controlador/MiCuenta.js"></script>

</body>

</html>
