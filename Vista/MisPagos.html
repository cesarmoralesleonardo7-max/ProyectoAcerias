<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/CSS/Registro.css">

    <title>CLUB ACERIAS - Mis Pagos</title>
</head>

<body class="fondo">

    <div class="header-mr d-flex justify-content-between align-items-center">

        <h3>Mis Pagos</h3>

        <a href="dashboard.html" class="btn btn-light btn-sm">
            <i class="bi bi-arrow-left"></i>
            Volver al panel
        </a>

    </div>

    <div class="container py-4">

        <div id="mensaje" class="mb-3"></div>

        <!-- Registro académico de un abono, sin pasarela de pagos -->

        <div class="card form-card shadow-sm p-4 mb-4">

            <h5 class="seccion">
                <i class="bi bi-credit-card"></i>
                Registrar pago
            </h5>


            <form id="FormAbono">

                <div class="row g-3">

                    <div class="col-md-6">

                        <label for="prestamoAbono" class="form-label">
                            Mi préstamo
                        </label>

                        <select id="prestamoAbono" class="form-select" required>

                            <option value="">
                                Cargando préstamos...
                            </option>

                        </select>

                    </div>

                    <div class="col-md-6">

                        <label for="valorAbono" class="form-label">
                            Valor cuota
                        </label>

                        <input type="number"
                            id="valorAbono"
                            class="form-control"
                            min="0.01"
                            step="0.01"
                            placeholder="Ej: 50000"
                            required>

                    </div>

                </div>

                <button type="submit"
                    id="btnAbonar"
                    class="btn btn-club mt-3"
                    disabled>

                    Pagar 

                </button>

                <div id="mensajeAbono" class="mt-3"></div>

            </form>

        </div>

        <!-- Historial de pagos -->

        <div class="card form-card shadow-sm p-4">

            <h5 class="seccion">
                <i class="bi bi-wallet-fill"></i>
                Historial de pagos
            </h5>

            <p class="text-muted">
                Consulta los pagos registrados de tus préstamos.
            </p>

            <div class="table-responsive">

                <table class="table table-striped table-hover">

                    <thead class="table">

                        <tr class="encabezado">

                            <th>Código del pago</th>
                            <th>Código del préstamo</th>
                            <th>Fecha del pago</th>
                            <th>Valor pagado</th>

                        </tr>

                    </thead>

                    <tbody id="tablaPagos">

                        <tr>

                            <td colspan="4" class="text-center">
                                Cargando pagos...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

            <div class="mt-3">

                <a href="dashboard.html" class="btn btn-club">

                    <i class="bi bi-arrow-left"></i>
                    Volver

                </a>

            </div>

        </div>

    </div>

    <script src="../Controlador/MiCuenta.js"></script>
    <script src="../Controlador/AbonosAsociado.js"></script>

</body>

</html>
