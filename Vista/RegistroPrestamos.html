<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/CSS/Registro.css">

    <title>CLUB ACERIAS - Registro de Préstamos</title>
</head>

<body class="fondo">

    <div class="header-mr d-flex justify-content-between align-items-center">
        <h3>Registro de Préstamos</h3>

        <a href="dashboard.html" class="btn btn-outline-light ">
            <i class="bi bi-arrow-left"></i> Volver al panel
        </a>
    </div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="card form-card shadow-sm p-4">

                    <form id="FormPrestamo">

                        <input type="hidden" id="idAsociado">

                        <h6 class="seccion">Asociado</h6>

                        <div class="row g-3">

                            <div class="col-md-6">

                                <label class="form-label" for="documento">
                                    Documento del asociado
                                </label>

                                <div class="input-group">

                                    <input type="number" class="form-control" id="documento" required>

                                    <button class="btn btn-outline-club" type="button" id="btnBuscar">

                                        <i class="bi bi-search"></i> Buscar

                                    </button>

                                </div>
                            </div>

                            <div class="col-md-6">

                                <label class="form-label" for="nombreAsociado">
                                    Nombre del asociado
                                </label>

                                <input type="text" class="form-control" id="nombreAsociado" readonly
                                    placeholder="Se completa al buscar">

                            </div>

                        </div>



                        <div class="row g-3">

                            <h6 class="seccion mt-4">Datos del préstamo</h6>

                            <div class="row g-3">

                                <div class="col-md-6">

                                    <label class="form-label">Fecha del préstamo</label>

                                    <input type="date" class="form-control" id="fechaPrestamo" required>

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label">Valor del préstamo</label>

                                    <div class="input-group">

                                        <span class="input-group-text">$</span>

                                        <input type="number" class="form-control" id="valorPrestamo" required min="1"
                                            max="80000000">

                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label">Tasa de interés mensual</label>

                                    <input type="number" class="form-control" id="tasaInteres" required min="0"
                                        step="0.01">

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label">Número de cuotas</label>

                                    <input type="number" class="form-control" id="numeroCuotas" required min="1">

                                </div>

                            </div>

                            <div class="d-flex gap-2 mt-4">

                                <button type="submit" id="btnRegistrar" class="btn btn-club flex-fill" disabled>

                                    <i class="bi bi-save"></i>
                                    Registrar préstamo

                                </button>

                                <button type="reset" class="btn btn-outline-club flex-fill">

                                    Limpiar formulario

                                </button>

                            </div>
                        </div>

                        <div id="mensaje" class="mt-3"></div>

                    </form>

                </div>

            </div>
        </div>
    </div>

    <script src="../Controlador/Prestamos.js"></script>

</body>

</html>
