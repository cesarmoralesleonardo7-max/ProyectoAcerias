<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../Assets/CSS/Registro.css">

    <title>Gestión de Actividades</title>

</head>

<body class="fondo">

 <body class="fondo">

    <div class="header-mr d-flex justify-content-between align-items-center">

    <h3 class="mb-0">Actividades Del Club</h3>

    <a href="dashboard.html" class="btn btn-outline-light">
        <i class="bi bi-arrow-left"></i>
        Volver al panel
    </a>

</div>

    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h4>Listado de actividades</h4>

            <a href="RegistroActividades.html" id="btnNuevaActividad" class="btn btn-club d-none">

                <i class="bi bi-plus-lg"></i>
                Nueva Actividad

            </a>

            <a href="Participaciones.html" class="btn btn-outline-primary">

                <i class="bi bi-people"></i>
                Participaciones

            </a>

        </div>

        <form id="FormFiltro" class="row g-3 mb-4">

            <div class="col-md-4">

                <label class="form-label">
                    Filtrar actividades
                </label>

                <select id="filtro" class="form-select">

                    <option value="todos">
                        Todas las actividades
                    </option>

                    <option value="cantidad">
                        Cantidad por año
                    </option>

                    <option value="municipio">
                        Por municipio
                    </option>

                </select>

            </div>

            <div id="grupoAnio" class="col-md-3 d-none">

                <label class="form-label">
                    Año
                </label>

                <input type="number" id="anio" class="form-control" value="2018">

            </div>

            <div id="grupoMunicipio" class="col-md-3 d-none">

                <label class="form-label">
                    Municipio
                </label>

                <select id="filtroMunicipio" class="form-select">

                    <option value="duitama">Duitama</option>

                    <option value="sogamoso">Sogamoso</option>

                    <option value="paipa">Paipa</option>

                </select>

            </div>

            <div class="col-md-5 d-flex align-items-end gap-2">

                <button type="submit" class="btn btn-club">

                    <i class="bi bi-search"></i>
                    Buscar

                </button>

                <button type="button" id="btnLimpiar" class="btn btn-outline-club">

                    Limpiar

                </button>

            </div>

        </form>

        <div id="contenedorCantidad" class="alert alert-info d-none">

            Cantidad de actividades:

            <strong id="cantidadActividades">0</strong>

        </div>

        <div class="card form-card shadow-sm" id="contenedorTabla">

            <div class="table-responsive">

                <table class="table table-striped table-hover mb-0">

                    <thead class="table-dark">

                        <tr>

                            <th>Actividad</th>

                            <th>Fecha</th>

                            <th>Municipio</th>

                            <th>Total recaudado</th>

                            <th id="encabezadoAcciones" class="d-none">
                                Acciones
                            </th>

                        </tr>

                    </thead>

                    <tbody id="listaActividades">

                        <tr>

                            <td colspan="4" class="text-center py-4">

                                Cargando actividades...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="../Controlador/Actividades.js"></script>

</body>

</html>
