<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../Assets/CSS/Registro.css">

    <title>CLUB ACERIAS - Registro de Pagos</title>
</head>

<body class="fondo">

    <div class="header-mr d-flex justify-content-between align-items-center">

        <h3>Registro de Pagos</h3>

        <a href="dashboard.html" class="btn btn-light btn-sm">
            <i class="bi bi-arrow-left"></i> Volver al panel
        </a>

    </div>

    <div class="container py-4">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card form-card shadow-sm p-4">

                    <form id="FormPago">

                        <input type="hidden" id="idPrestamo">

                        <h6 class="seccion">Préstamo</h6>

                        <div class="row g-3">

                            <div class="col-md-6">

                                <label class="form-label" for="codigoPrestamo">
                                    Código del préstamo
                                </label>

                                <div class="input-group">

                                    <input type="number" class="form-control"
                                        id="codigoPrestamo" required
                                        min="1" placeholder="Ej: 5">

                                    <button class="btn btn-outline-club"
                                        type="button" id="btnBuscar">

                                        <i class="bi bi-search"></i> Buscar

                                    </button>

                                </div>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label" for="nombreAsociado">
                                    Asociado
                                </label>

                                <input type="text" class="form-control"
                                    id="nombreAsociado" readonly
                                    placeholder="Se completa al buscar">

                            </div>

                            <div class="col-md-4">

                                <label class="form-label" for="valorCuota">
                                    Valor de la cuota
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">$</span>

                                    <input type="text" class="form-control"
                                        id="valorCuota" readonly
                                        placeholder="Pendiente de cálculo">

                                </div>

                            </div>

                            <div class="col-md-4">

                                <label class="form-label" for="cuotasPagadas">
                                    Cuotas pagadas
                                </label>

                                <input type="text" class="form-control"
                                    id="cuotasPagadas" readonly
                                    placeholder="Pendiente">

                            </div>

                            <div class="col-md-4">

                                <label class="form-label" for="saldoPendiente">
                                    Saldo pendiente
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">$</span>

                                    <input type="text" class="form-control"
                                        id="saldoPendiente" readonly
                                        placeholder="Pendiente">

                                </div>

                            </div>

                        </div>

                        <h6 class="seccion mt-4">Datos del pago</h6>

                        <div class="row g-3">

                            <div class="col-md-4">

                                <label class="form-label" for="codigoPago">
                                    Código del pago
                                </label>

                                <input type="text" class="form-control"
                                    id="codigoPago" readonly
                                    placeholder="Automático">

                            </div>

                            <div class="col-md-4">

                                <label class="form-label" for="numeroCuota">
                                    Número de cuota
                                </label>

                                <input type="number" class="form-control"
                                    id="numeroCuota" min="1"
                                    placeholder="Pendiente" disabled>

                            </div>

                            <div class="col-md-4">

                                <label class="form-label" for="fechaPago">
                                    Fecha de pago
                                </label>

                                <input type="date" class="form-control"
                                    id="fechaPago" required>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label" for="valorPagado">
                                    Valor pagado
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">$</span>

                                    <input type="number" class="form-control"
                                        id="valorPagado" required
                                        min="1" step="0.01">

                                </div>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label" for="metodoPago">
                                    Método de pago
                                </label>

                                <select class="form-select"
                                    id="metodoPago" disabled>

                                    <option value="">Seleccione</option>
                                    <option value="efectivo">Efectivo</option>
                                    <option value="transferencia">Transferencia</option>
                                    <option value="consignacion">Consignación</option>

                                </select>

                            </div>

                            <div class="col-12">

                                <label class="form-label" for="observaciones">
                                    Observaciones
                                </label>

                                <textarea class="form-control"
                                    id="observaciones" rows="2"
                                    placeholder="Pendiente de implementar"
                                    disabled></textarea>

                            </div>

                        </div>

                        <div class="d-flex gap-2 mt-4">

                            <button type="submit" id="btnRegistrar"
                                class="btn btn-club flex-fill" disabled>

                                <i class="bi bi-save"></i>
                                Registrar pago

                            </button>

                            <button type="reset"
                                class="btn btn-outline-club flex-fill">

                                Limpiar formulario

                            </button>

                        </div>

                        <div id="mensaje" class="mt-3"></div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="../Controlador/Pagos.js"></script>

</body>

</html>
