<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de préstamos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../Assets/CSS/Registro.css">
</head>

<body class="fondo">

    <div class="header-mr d-flex justify-content-between align-items-center">

    <h3 class="mb-0">Préstamos del club</h3>

    <a href="dashboard.html" class="btn btn-outline-light">
        <i class="bi bi-arrow-left"></i>
        Volver al panel
    </a>

</div>

    <main class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="h4 mb-0 seccion">
                Listado de préstamos
            </h2>

            <a href="RegistroPrestamos.html" class="btn btn-club">
                <i class="bi bi-plus-lg"></i>
                Nuevo préstamo
            </a>

        </div>

        <!-- Formulario de filtros -->

        <div class="card shadow-sm form-card p-3 mb-4">

            <form id="FormFiltro">

                <div class="row g-3 align-items-end">

                    <div class="col-md-4">

                        <label class="form-label">Filtrar por</label>

                        <select id="filtro" class="form-select">

                            <option value="todos">Todos los préstamos</option>

                            <option value="cantidad">Cantidad de préstamos</option>

                            <option value="fechas">Rango de fechas</option>

                            <option value="documento">Documento del asociado</option>

                        </select>

                    </div>

                    <div class="col-md-3 d-none" id="grupoFechaInicio">

                        <label class="form-label">Fecha inicial</label>

                        <input type="date" id="fechaInicio"
                            class="form-control">

                    </div>

                    <div class="col-md-3 d-none" id="grupoFechaFin">

                        <label class="form-label">Fecha final</label>

                        <input type="date" id="fechaFin"
                            class="form-control">

                    </div>

                    <div class="col-md-4 d-none" id="grupoDocumento">

                        <label class="form-label">Documento</label>

                        <input type="text" id="filtroDocumento"
                            class="form-control"
                            placeholder="Documento del asociado">

                    </div>

                    <div class="col-md-auto">

                        <button type="submit" class="btn btn-club">
                            <i class="bi bi-search"></i>
                            Consultar
                        </button>

                        <button type="button" id="btnLimpiar"
                            class="btn btn-outline-club">
                            Limpiar
                        </button>

                    </div>

                </div>

            </form>

        </div>

        <!-- Cantidad de préstamos -->

        <div class="card shadow-sm form-card p-3 mb-4 d-none"
            id="contenedorCantidad">

            <h6 class="seccion">Cantidad de préstamos realizados</h6>

            <h3 id="cantidadPrestamos">0</h3>

        </div>

        <!-- Tabla de préstamos -->

        <div class="card shadow-sm form-card" id="contenedorTabla">

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle mb-0">

                    <thead class="table-primary">

                        <tr>
                            <th>Código</th>
                            <th>Documento</th>
                            <th>Nombres</th>
                            <th>Apellidos</th>
                            <th>Fecha</th>
                            <th>Valor del préstamo</th>
                            <th>Tasa de interés</th>
                            <th>Número de cuotas</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>

                    <tbody id="listaPrestamos">

                        <tr>

                            <td colspan="9" class="text-center py-4">
                                Cargando préstamos...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

        <!-- Formulario de edición -->

        <div class="card shadow-sm form-card p-4 mt-4 d-none"
            id="contenedorEdicion">

            <h6 class="seccion">Editar préstamo</h6>

            <form id="FormEditarPrestamo">

                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label">Código del préstamo</label>

                        <input type="text" id="idPrestamo"
                            class="form-control" readonly>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Nombre del asociado</label>

                        <input type="text" id="nombreAsociado"
                            class="form-control" readonly>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Fecha del préstamo</label>

                        <input type="date" id="fechaPrestamo"
                            class="form-control" required>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Valor del préstamo</label>

                        <input type="number" id="valorPrestamo"
                            class="form-control"
                            min="1" max="80000000" required>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Tasa de interés</label>

                        <input type="number" id="tasaInteres"
                            class="form-control"
                            min="0" step="0.01" required>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Número de cuotas</label>

                        <input type="number" id="numeroCuotas"
                            class="form-control" min="1" required>

                    </div>

                </div>

                <div class="d-flex gap-2 mt-4">

                    <button type="submit" class="btn btn-club">

                        <i class="bi bi-save"></i>
                        Guardar cambios

                    </button>

                    <button type="button" id="btnCancelar"
                        class="btn btn-outline-club">

                        Cancelar

                    </button>

                </div>

            </form>

        </div>

    </main>

    <script src="../Controlador/Prestamos.js"></script>

</body>

</html>
