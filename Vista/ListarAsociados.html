<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de Asociados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../Assets/CSS/Registro.css">
</head>

<body class="fondo">

    <body class="fondo">

    <div class="header-mr d-flex justify-content-between align-items-center">

    <h3 class="mb-0">Asociados Del Club</h3>

    <a href="dashboard.html" class="btn btn-outline-light">
        <i class="bi bi-arrow-left"></i>
        Volver al panel
    </a>

</div>

    <main class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="h4 mb-0 seccion">
                Listado de asociados
            </h2>

            <a href="Registro.html" class="btn btn-club">
                <i class="bi bi-plus-lg"></i>
                Nuevo asociado
            </a>

        </div>

        <!-- Filtros -->

        <div class="card shadow-sm form-card p-3 mb-4">

            <form id="FormFiltro">

                <div class="row g-3 align-items-end">

                    <div class="col-md-4">

                        <label class="form-label">Filtrar por</label>

                        <select id="filtro" class="form-select">

                            <option value="todos">Todos los asociados</option>
                            <option value="genero">Género</option>
                            <option value="ciudad">Ciudad</option>

                        </select>

                    </div>

                    <div class="col-md-4 d-none" id="grupoGenero">

                        <label class="form-label">Género</label>

                        <select id="filtroGenero" class="form-select">

                            <option value="femenino">Femenino</option>
                            <option value="masculino">Masculino</option>
                            <option value="otro">Otro</option>

                        </select>

                    </div>

                    <div class="col-md-4 d-none" id="grupoCiudad">

                        <label class="form-label">Ciudad</label>

                        <select id="filtroCiudad" class="form-select">

                            <option value="duitama">Duitama</option>
                            <option value="sogamoso">Sogamoso</option>
                            <option value="paipa">Paipa</option>

                        </select>

                    </div>

                    <div class="col-md-4">

                        <button type="submit" class="btn btn-club">
                            <i class="bi bi-search"></i>
                            Consultar
                        </button>

                        <button type="button" id="btnLimpiar"
                            class="btn btn-outline-club">
                            Limpiar
                        </button>

                    </div>

                </div>

            </form>

        </div>

        <!-- Tabla de asociados -->

        <div class="card shadow-sm form-card">

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle mb-0">

                    <thead class="table-primary">

                        <tr>
                            <th>Documento</th>
                            <th>Nombres</th>
                            <th>Apellidos</th>
                            <th>Fecha de nacimiento</th>
                            <th>Género</th>
                            <th>Dirección</th>
                            <th>Ciudad</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>

                    <tbody id="listaAsociados">

                        <tr>
                            <td colspan="10" class="text-center py-4">
                                Cargando asociados...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

        <!-- Formulario de edición -->

        <div class="card shadow-sm form-card p-4 mt-4 d-none"
            id="contenedorEdicion">

            <h6 class="seccion">Editar asociado</h6>

            <form id="FormEditarAsociado">

                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label">Documento</label>

                        <input type="text" id="documento"
                            class="form-control" readonly>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Fecha de nacimiento</label>

                        <input type="date" id="fechaNacimiento"
                            class="form-control" required>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Nombres</label>

                        <input type="text" id="nombres"
                            class="form-control" required>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Apellidos</label>

                        <input type="text" id="apellidos"
                            class="form-control" required>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Género</label>

                        <select id="genero" class="form-select" required>

                            <option value="femenino">Femenino</option>
                            <option value="masculino">Masculino</option>
                            <option value="otro">Otro</option>

                        </select>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Ciudad</label>

                        <select id="ciudad" class="form-select" required>

                            <option value="duitama">Duitama</option>
                            <option value="sogamoso">Sogamoso</option>
                            <option value="paipa">Paipa</option>

                        </select>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Dirección de residencia</label>

                        <input type="text" id="direccionResidencia"
                            class="form-control" required>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Teléfono</label>

                        <input type="tel" id="telefono"
                            class="form-control" required>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Correo electrónico</label>

                        <input type="email" id="email"
                            class="form-control" required>

                    </div>

                </div>

                <div class="d-flex gap-2 mt-4">

                    <button type="submit" class="btn btn-club">
                        <i class="bi bi-save"></i>
                        Guardar cambios
                    </button>

                    <button type="button" id="btnCancelar"
                        class="btn btn-outline-club">
                        Cancelar
                    </button>

                </div>

            </form>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../Controlador/gestionarAsociados.js"></script>

</body>

</html>
