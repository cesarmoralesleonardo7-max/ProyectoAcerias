<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/CSS/Registro.css">

    <title>CLUB ACERIAS - Mi Perfil</title>
</head>

<body class="fondo">

    <div class="header-mr d-flex justify-content-between align-items-center">

        <h3>Mi Perfil</h3>

        <a href="dashboard.html" class="btn btn-light btn-sm">
            <i class="bi bi-arrow-left"></i>
            Volver al panel
        </a>

    </div>

    <div class="container py-4">

        <div id="mensaje" class="mb-3"></div>

        <div class="row justify-content-center">

            <div class="col-lg-9">

                <div class="card form-card shadow-sm p-4">

                    <h5 class="seccion">
                        <i class="bi bi-person-vcard"></i>
                        Información personal
                    </h5>

                    <div class="row g-3 mt-2">

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nombre completo</label>
                            <p id="perfilNombre">Cargando...</p>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Documento</label>
                            <p id="perfilDocumento">Cargando...</p>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Fecha de nacimiento</label>
                            <p id="perfilNacimiento">Cargando...</p>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Género</label>
                            <p id="perfilGenero">Cargando...</p>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Dirección</label>
                            <p id="perfilDireccion">Cargando...</p>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Ciudad</label>
                            <p id="perfilCiudad">Cargando...</p>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Teléfono</label>
                            <p id="perfilTelefono">Cargando...</p>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Correo electrónico</label>
                            <p id="perfilEmail">Cargando...</p>
                        </div>

                    </div>

                    <div class="mt-4">

                        <a href="dashboard.html" class="btn btn-outline-primary">
                            <i class="bi bi-arrow-left"></i>
                            Volver
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="../Controlador/MiCuenta.js"></script>

</body>

</html>
